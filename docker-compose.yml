version: '3.8'

services:
  # Green Cloud Web Application
  green-cloud-app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - green-cloud-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - green-cloud-network

  # PostgreSQL database (optional)
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=greencloud
      - POSTGRES_USER=greencloud
      - POSTGRES_PASSWORD=secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - green-cloud-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - green-cloud-app
    restart: unless-stopped
    networks:
      - green-cloud-network

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - green-cloud-network

  # Grafana for dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_change_me
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - green-cloud-network

networks:
  green-cloud-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

# Usage Instructions:
#
# 1. Basic deployment (just the web app):
#    docker-compose up green-cloud-app
#
# 2. Full stack deployment:
#    docker-compose up -d
#
# 3. Development mode with logs:
#    docker-compose up
#
# 4. Scale the application:
#    docker-compose up --scale green-cloud-app=3
#
# 5. Update and restart:
#    docker-compose build green-cloud-app
#    docker-compose up -d green-cloud-app
#
# 6. View logs:
#    docker-compose logs -f green-cloud-app
#
# 7. Stop services:
#    docker-compose down
#
# 8. Clean up (remove volumes):
#    docker-compose down -v